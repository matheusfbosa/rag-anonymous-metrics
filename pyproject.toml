[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-anonymous-metrics"
version = "0.1.0"
description = "Privacy/Utility evaluation for rag-anonymous."
requires-python = ">=3.12"
dependencies = [
    "rag-anonymous",
    "python-dotenv>=1.0,<2",
    "pandas>=2.0,<3.0",
    "ragas==0.4.3",
    "langchain-community==0.4.0",
]

[project.scripts]
rag-metrics = "rag_anonymous_metrics.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
]
dev = [
    "rag-anonymous-metrics[test]",
    "pre-commit>=4.0",
    "ruff>=0.12",
]
notebook = [
    "ipykernel>=6.29",
    "jupyter>=1.0,<2",
    "matplotlib>=3.8,<4",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<1",
    "statsmodels>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["rag_anonymous_metrics*"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["rag_anonymous_metrics"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ANN",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["rag_anonymous", "rag_anonymous_metrics"]
