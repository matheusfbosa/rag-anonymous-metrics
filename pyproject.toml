[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-anonymous-metrics"
version = "0.1.0"
description = "Privacy/Utility evaluation for rag-anonymous."
requires-python = ">=3.12"
dependencies = [
    "rag-anonymous",
    "pandas>=2.0,<3.0",
]

[project.scripts]
rag-metrics = "rag_anonymous_metrics.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["rag_anonymous_metrics*"]
